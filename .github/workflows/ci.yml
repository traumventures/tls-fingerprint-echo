name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    uses: traumventures/ci/.github/workflows/go.yml@v1
  docker:
    uses: traumventures/ci/.github/workflows/docker.yml@v1
    with:
      image: tls-fingerprint-echo
